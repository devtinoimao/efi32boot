name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            packages: nasm gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
            target: all payload
          # Cross-compile coverage for future ports; these only check the
          # toolchain builds clean sources for now.
          - arch: aarch64
            packages: gcc-aarch64-linux-gnu
            target: --version check
          - arch: riscv64
            packages: gcc-riscv64-unknown-elf
            target: --version check
          - arch: ppc64
            packages: gcc-powerpc64le-linux-gnu
            target: --version check
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.packages }} qemu-system-x86 mtools dosfstools

      - name: Build (${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            make TOOLCHAIN_PREFIX=/usr/bin/ all payload
            sha256sum BOOTX64.EFI
          else
            ${{ matrix.arch == 'aarch64' && 'aarch64-linux-gnu-gcc' || matrix.arch == 'riscv64' && 'riscv64-unknown-elf-gcc' || 'powerpc64le-linux-gnu-gcc' }} --version
          fi

      - name: Upload loader artifact
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: BOOTX64.EFI
          path: BOOTX64.EFI

  boot-test:
    name: tcg boot smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 mtools dosfstools ovmf
          ls /usr/share/OVMF/

      - name: Download built loader
        uses: actions/download-artifact@v4
        with:
          name: BOOTX64.EFI
          path: .

      - name: Build test ESP (loader-only)
        run: |
          dd if=/dev/zero of=esp_ci.img bs=1M count=64 status=none
          mkfs.vfat -F 32 -n ESP esp_ci.img
          mmd -i esp_ci.img ::/EFI ::/EFI/BOOT
          mcopy -i esp_ci.img BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mdir -i esp_ci.img ::/EFI/BOOT

      - name: TCG boot test (no KVM on runners)
        run: |
          mkdir -p vars
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars/OVMF_VARS.fd
          # Boot the hosted firmware chain under TCG, wait for the UEFI Shell
          # prompt marker on serial. This proves: outer OVMF -> 64->32
          # transition -> hosted OVMF32 -> shell, with zero exceptions.
          timeout 600 qemu-system-x86_64 \
            -accel tcg -cpu qemu64 -m 2048 -smp 2 -display none \
            -serial file:boot.log \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars/OVMF_VARS.fd \
            -drive format=raw,file=esp_ci.img || true
          echo "=== boot log tail ==="
          tail -c 2000 boot.log | tr -d '\000' || true
          if grep -qa "Shell>" boot.log; then
            echo "PASS: hosted firmware reached the UEFI Shell"
          else
            echo "FAIL: no Shell prompt in serial log"
            exit 1
          fi

      - name: Upload debug artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-debug
          path: |
            boot.log
            OVMF32.fd

  # Level 2 scaffold: autofix on failure. Enable by adding repo secret
